server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  sqs:
    queues:
      video-notification: ${AWS_SQS_VIDEO_NOTIFICATION_QUEUE:video-notification-queue}
  notification:
    from-email: ${NOTIFICATION_FROM_EMAIL:no-reply@fiapx.local}
