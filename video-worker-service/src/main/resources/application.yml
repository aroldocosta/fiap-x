server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: video-worker-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fiapx_video}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
        queues:
          video-uploaded: ${AWS_SQS_VIDEO_UPLOADED_QUEUE:video-uploaded-queue}

app:
  ffmpeg:
    binary-path: ${FFMPEG_BINARY_PATH:ffmpeg}
  storage:
    frames-dir: ${FRAMES_DIR:./storage/frames}
    zips-dir: ${ZIPS_DIR:./storage/zips}
